<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego para Mamá ❤️</title>
<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        background:#ffe6f0;
        padding:50px;
    }
    .caja{
        background:white;
        padding:20px;
        border-radius:15px;
        max-width:400px;
        margin:auto;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }
    input, button{
        padding:10px;
        margin:10px;
        font-size:16px;
    }
</style>
</head>
<body>

<div class="caja">
    <h1>❤️ Juego para Mamá ❤️</h1>
    <p>Adivina la palabra:</p>
    <h2 id="palabra">AAMM</h2>

    <input type="text" id="respuesta" placeholder="Escribe tu respuesta">
    <br>
    <button onclick="verificar()">Comprobar</button>

    <p id="mensaje"></p>
</div>

<script>
function verificar() {
    let respuesta = document.getElementById("respuesta").value.toLowerCase();
    let mensaje = document.getElementById("mensaje");

    if(respuesta === "mamá" || respuesta === "mama"){
        mensaje.innerHTML = "🎉 ¡Correcto! Te quiero mucho, mamá ❤️";
    } else {
        mensaje.innerHTML = "❌ Intenta otra vez 😜";
    }
}
</script>

</body>
</html>
