<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Universal - MP3 & MP4</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --background: #dfe6e9;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .app-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
            color: #636e72;
        }

        input[type="url"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #b2bec3;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }

        button:hover {
            background-color: #5849c2;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }

        .message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            background-color: #ff7675;
            color: white;
            display: block;
        }

        .message.success {
            background-color: #55efc4;
            color: #2d3436;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Downloader Pro</h1>
        
        <div class="input-group">
            <label for="urlInput">Enlace directo (URL):</label>
            <input type="url" id="urlInput" placeholder="Ejemplo: https://ejemplo.com/cancion.mp3">
        </div>

        <div class="input-group">
            <label for="formatSelect">Seleccionar Formato:</label>
            <select id="formatSelect">
                <option value="mp4">Video (MP4)</option>
                <option value="mp3">Audio (MP3)</option>
            </select>
        </div>

        <button id="downloadBtn" onclick="iniciarDescarga()">Descargar</button>

        <div class="message" id="messageBox"></div>
        
        <p style="font-size: 0.8rem; color: #999; margin-top: 20px;">
            Nota: Solo funciona con enlaces directos a archivos (.mp3 o .mp4).
        </p>
    </div>

    <script>
        function iniciarDescarga() {
            const urlInput = document.getElementById('urlInput');
            const formatSelect = document.getElementById('formatSelect');
            const downloadBtn = document.getElementById('downloadBtn');
            const messageBox = document.getElementById('messageBox');

            let url = urlInput.value.trim();
            let formato = formatSelect.value;

            // Limpiar mensajes anteriores
            messageBox.className = 'message';
            messageBox.style.display = 'none';

            // Validación 1: Campo vacío
            if (!url) {
                mostrarError("Por favor, ingresa un enlace.");
                return;
            }

            // Validación 2: Verificar que sea un enlacehttp/https
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                mostrarError("El enlace debe empezar por http:// o https://");
                return;
            }

            // Validación 3: Intentar detectar la extensión real
            // Si el usuario eligió MP3, verificamos que la URL termine en algo relacionado
            // Si no termina en una extensión conocida, intentaremos forzar la descarga
            
            downloadBtn.disabled = true;
            downloadBtn.innerText = "Iniciando descarga...";

            // Forzar descarga usando un elemento隐形 <a>
            try {
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank'; // Abrir en nueva pestaña si no descarga
                link.download = ''; // Intenta descargar (funciona en Chrome/Firefox si el servidor lo permite)
                
                // Añadir al DOM, click, y quitar
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                downloadBtn.disabled = false;
                downloadBtn.innerText = "Descargar";
                
                // Si el enlace es directo y el servidor lo permite, esto abrirá la descarga
                mostrarSuccess("Descargando... revisa tu carpeta de descargas.");

                // Si después de 3 segundos no pasó nada, advertimos
                setTimeout(() => {
                    if (messageBox.classList.contains('success')) {
                        // Todo bien, la descarga debió empezar
                    }
                }, 3000);

            } catch (e) {
                downloadBtn.disabled = false;
                downloadBtn.innerText = "Descargar";
                mostrarError("Error al intentar descargar. El servidor puede tener restricciones.");
                console.error(e);
            }
        }

        function mostrarError(msg) {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerText = msg;
            messageBox.className = 'message error';
            messageBox.style.display = 'block';
        }

        function mostrarSuccess(msg) {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerText = msg;
            messageBox.className = 'message success';
            messageBox.style.display = 'block';
        }
    </script>
</body>
</html>
