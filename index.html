<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Pro - MP3 & MP4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #1e3c72;
            outline: none;
        }

        .format-options {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .format-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .format-btn.active {
            background: #1e3c72;
            color: white;
            border-color: #1e3c72;
        }

        .download-btn {
            width: 100%;
            padding: 18px;
            background: #00d26a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .download-btn:hover {
            transform: scale(1.02);
            background: #00b85e;
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result a {
            display: block;
            padding: 15px;
            background: #1e3c72;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
        }

        .result a:hover {
            background: #2a5298;
        }

        .note {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⬇️ LUXTIN MUSIC™</h1>
        
        <div class="input-group">
            <label>Pega el enlace del vídeo:</label>
            <input type="text" id="urlInput" placeholder="Ej: https://www.youtube.com/watch?v=...">
        </div>

        <label>Elige el formato:</label>
        <div class="format-options">
            <div class="format-btn active" onclick="selectFormat('mp3', this)" id="btnMp3">
                🎵 MP3
            </div>
            <div class="format-btn" onclick="selectFormat('mp4', this)" id="btnMp4">
                🎬 MP4
            </div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadMedia()">
            DESCARGAR
        </button>

        <div class="result" id="resultContainer">
            <p style="margin-bottom: 10px; color: #333;">✅ ¡Procesado! Haz clic para descargar:</p>
            <a id="downloadLink" href="#" target="_blank">Descargar Archivo</a>
        </div>

        <p class="note">
            Solo para uso personal. Respeta los derechos de autor.
        </p>
    </div>

    <script>
        let selectedFormat = 'mp3';

        function selectFormat(format, element) {
            selectedFormat = format;
            
            // Quitar active de todos
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Agregar active al seleccionado
            element.classList.add('active');
        }

        function downloadMedia() {
            const urlInput = document.getElementById('urlInput');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultContainer = document.getElementById('resultContainer');
            const downloadLink = document.getElementById('downloadLink');

            let url = urlInput.value.trim();

            if (!url) {
                alert('Por favor, pega un enlace primero');
                return;
            }

            // Verificar que sea YouTube
            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                alert('Por ahora solo funciona con enlaces de YouTube');
                return;
            }

            downloadBtn.disabled = true;
            downloadBtn.innerText = 'Procesando...';

            // Usar API pública de y2mate (gratuita)
            // Nota: Este método puede variar ya que depende de servicios externos
            fetch(`https://www.y2mate.com/youtube-mp3?url=${encodeURIComponent(url)}`)
                .then(response => response.text())
                .then(html => {
                    // Buscar el link de descarga en la respuesta
                    let parser = new DOMParser();
                    let doc = parser.parseFromString(html, 'text/html');
                    let link = doc.querySelector('.download-link')?.href || 
                              doc.querySelector('a[href*="download"]')?.href;

                    if (link) {
                        downloadLink.href = link;
                        resultContainer.classList.add('show');
                        downloadBtn.innerText = 'DESCARGAR';
                        downloadBtn.disabled = false;
                    } else {
                        // Método alternativo: abrir en nueva pestaña
                        let videoId = url.split('v=')[1]?.split('&')[0];
                        let altUrl = `https://www.y2mate.com/youtube/${videoId}`;
                        window.open(altUrl, '_blank');
                        downloadBtn.innerText = 'DESCARGAR';
                        downloadBtn.disabled = false;
                        alert('Se abrirá una página externa para completar la descarga');
                    }
                })
                .catch(error => {
                    // Si falla, abrir en nueva pestaña
                    let videoId = url.includes('youtu.be') ? url.split('/').pop().split('?')[0] : url.split('v=')[1]?.split('&')[0];
                    if(videoId) {
                        window.open(`https://www.y2mate.com/youtube/${videoId}`, '_blank');
                    }
                    downloadBtn.innerText = 'DESCARGAR';
                    downloadBtn.disabled = false;
                });
        }
    </script>
</body>
</html>
